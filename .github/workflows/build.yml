# Builds and tests grapple on Windows and Linux: the Windows installer (NSIS) and the Linux AppImage.
#
# Runs by hand (Actions > build > Run workflow), on pushes to main and on pull requests. The installers are workflow
# artifacts kept 14 days; nothing is released or uploaded anywhere else. The workflow needs no secrets and gets a
# read-only token; actions are pinned to commit SHAs.

name: build

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The same Rust release as the Nix dev shells (flake.lock's nixpkgs).
  RUST_VERSION: "1.99.0"

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/ui/pnpm-lock.yaml

      - name: UI dependencies
        working-directory: app/ui
        run: pnpm install --frozen-lockfile

      - name: Tests (every crate and the app's unit tests; the Linux-only ones are cfg(unix))
        run: cargo test --workspace --no-fail-fast

      - name: UI
        working-directory: app/ui
        run: pnpm build

      # The UI is already built, so the CLI's own beforeBuildCommand is switched off.
      - name: Installer (NSIS)
        working-directory: app/src-tauri
        run: ../ui/node_modules/.bin/tauri build --bundles nsis --config '{"build":{"beforeBuildCommand":""}}'

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: grapple-windows-installer
          path: target/release/bundle/nsis/*.exe
          retention-days: 14
          if-no-files-found: error

  linux-appimage:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libdbus-1-dev libssl-dev patchelf

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/ui/pnpm-lock.yaml

      - name: UI
        working-directory: app/ui
        run: pnpm install --frozen-lockfile && pnpm build

      - name: Tests
        run: cargo test --workspace --no-fail-fast

      - name: AppImage
        working-directory: app/src-tauri
        run: ../ui/node_modules/.bin/tauri build --bundles appimage --config '{"build":{"beforeBuildCommand":""}}'

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: grapple-linux-appimage
          path: target/release/bundle/appimage/*.AppImage
          retention-days: 14
          if-no-files-found: error
