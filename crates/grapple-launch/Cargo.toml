[package]
name = "grapple-launch"
version.workspace = true
edition.workspace = true
license = "GPL-3.0-only"
publish.workspace = true

[dependencies]
grapple-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Processes, windows and file locks on Windows (src/winproc.rs, src/spawn.rs, src/epic_auth.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["net", "io-util", "test-util"] }
