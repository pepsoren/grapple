[package]
name = "grapple-store"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Grapple's game store: Steam and Epic data, caching, prices, wishlist, recommendations"

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["net", "io-util"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
rusqlite = { version = "0.40", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sha2 = "0.10"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# The ITAD key lives in the system keyring (Secret Service), like tether's tokens; never in a file or a log.
keyring = { version = "3.6", default-features = false, features = ["async-secret-service", "tokio", "crypto-rust"] }
# The one crypto provider (reqwest already uses it); installed explicitly, as grapple-tether does.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }

# Windows keeps the secrets in its Credential Manager (keyring's `windows-native` store); without it keyring would
# fall back to a store that forgets everything when grapple exits.
[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }

[dev-dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# For examples/cold_build.rs: the real library (read-only scan) and a temp database.
grapple-core.workspace = true
grapple-scan.workspace = true
# For examples/epic_probe.rs: the Epic login.
grapple-launch.workspace = true
tempfile = "3"
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "json", "query"] }
tokio = { workspace = true, features = ["net", "io-util", "test-util"] }
